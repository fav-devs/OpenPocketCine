[package]
name = "opc-media"
description = "The camera's media library for the desktop shell: catalogue paging, SoftAP HTTP, the cache, and proxy playback candidates."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
opc-camera = { path = "../opc-camera" }
opc-core-sys = { path = "../opc-core-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }
zune-jpeg = "0.5"

[lints]
workspace = true
