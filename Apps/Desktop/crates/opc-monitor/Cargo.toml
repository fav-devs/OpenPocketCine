[package]
name = "opc-monitor"
description = "The desktop viewfinder: a laptop window on the camera, with the gimbal, zoom, recording and tracking under the operator's hands."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Everything worth testing is in the library; the binary is the window and the socket
# around it. Building a test harness for it would ask a machine with no Swift toolchain
# to link the core just to run zero tests.
[[bin]]
name = "opc-monitor"
path = "src/main.rs"
test = false

[dependencies]
opc-camera = { path = "../opc-camera" }
opc-core-sys = { path = "../opc-core-sys" }
opc-chrome = { path = "../opc-chrome" }
opc-decode = { path = "../opc-decode" }
opc-media = { path = "../opc-media" }
opc-render = { path = "../opc-render" }
opc-ui = { path = "../opc-ui" }
opc-vcam = { path = "../opc-vcam" }
raw-window-handle = "0.6"
winit = "0.30"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29"
btleplug = "0.11"
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
uuid = "1"
gilrs = "0.11"

[lints]
workspace = true
